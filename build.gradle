
import org.asciidoctor.gradle.jvm.AsciidoctorTask
import org.asciidoctor.gradle.jvm.pdf.AsciidoctorPdfTask
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.plugins.signing.Sign

// =====================================================================================================
// GroovyConcurrentUtils 2.0.0 - multi-project build.
//
//   gcu-core       promises, dataflow, pools, gstream, config, agents, security   -> org.softwood:gcu-core
//   gcu-cluster    Hazelcast cluster manager and the shared cluster state types   -> org.softwood:gcu-cluster
//   gcu-taskgraph  the TaskGraph engine, task types, scripts, persistence        -> org.softwood:gcu-taskgraph
//   gcu-actors     actors and remote actor transports                            -> org.softwood:gcu-actors
//   gcu-reactive   Reactor helpers                                                -> org.softwood:gcu-reactive
//
//   root           GroovyConcurrentUtils: the aggregate. Its POM depends on all five modules, so a consumer
//                  that used org.softwood:GroovyConcurrentUtils:1.x changes the version and nothing else.
//                  Its own jar carries no classes. The root also holds the cross-module tests (src/test).
//
// Build:   gradlew build                    every module jar, all tests
//          gradlew :gcu-core:jar            one module          -> gcu-core/build/libs/gcu-core-2.0.0.jar
//          gradlew allJar                   every GCU class in one jar, no third-party classes
//                                                               -> build/libs/GroovyConcurrentUtils-2.0.0-all.jar
//          gradlew fatJar                   GCU and every runtime dependency in one jar
//                                                               -> build/libs/GroovyConcurrentUtils-2.0.0-fat.jar
//          gradlew publishToMavenLocal      the five modules and the aggregate
// allJar and fatJar are build outputs, not published artifacts (see docs chapter "Modules and building").
// =====================================================================================================

plugins {
    id 'groovy'
    id 'java-library'
    id 'java-test-fixtures'
    id 'idea'
    id "org.asciidoctor.jvm.convert" version "4.0.5"
    id "org.asciidoctor.jvm.pdf" version "4.0.5"
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'com.gradleup.shadow' version '9.2.2' apply false
}

// 2.0.0: the single jar is split into five modules (gcu-core, gcu-cluster, gcu-taskgraph, gcu-actors,
// gcu-reactive) plus the aggregate GroovyConcurrentUtils; package names are unchanged (see CHANGENOTE.md).
// 1.4.2: a shell run on Windows is held in a Job Object, so a timeout stops processes whose parent has already exited (see CHANGENOTE.md). 1.4.1: ShellTask (allow 'process' + interpreters), allow 'sql' on named datasources, a capability reachable only through its methods (see CHANGENOTE.md, "What you must change"). 1.4.0: restricted evaluation - ControlTask rule conditions and ScriptTask scripts compiled under a profile, trusted true, allow 'files'/'http', enforced scriptTimeout, failure signal on events and exceptions (see CHANGENOTE.md, "What you must change"). 1.3.0: safe defaults - HttpTask guard, FileTask strict by default, remote transports on loopback with marked actors, cluster event signing and deserialisation allow-list (see CHANGENOTE.md, "What you must change"). 1.2.2: defects - TaskContext builder config and lazy caches, one promise state, dataflow listeners/timeouts/interrupts/task overloads, actor mailbox resize, JWT with no exp, opt-in result redaction (see CHANGENOTE.md). 1.2.1: second hardening pass - actor stop/supervision, agent state version, deserialisation filter, Hazelcast security settings applied, external config sources, timers released (see CHANGENOTE.md). 1.2.0: core hardening. 1.1.2: Groovy 6.0.0 / Spock 2.5-groovy-6.0
allprojects {
    group = 'org.softwood'
    version = '2.0.4' // gcu-version: the release stamp (CS contract stamp-gcu-gradle); set it with bump-baseline serverName=gcu
}

// Repositories are declared once, in settings.gradle (dependencyResolutionManagement, PREFER_SETTINGS).

// Library versions shared by the module build files.
ext.libs = [
        hazelcast    : 'com.hazelcast:hazelcast:5.6.0',
        slf4j        : 'org.slf4j:slf4j-api:2.0.17',
        logback      : 'ch.qos.logback:logback-classic:1.5.20',
        snakeyaml    : 'org.yaml:snakeyaml:2.5',
        mail         : 'org.simplejavamail:simple-java-mail:8.12.6',
        esStorage    : 'org.eclipse.store:storage-embedded:3.1.0',
        esConfig     : 'org.eclipse.store:storage-embedded-configuration:3.1.0',
        esSerializer : 'org.eclipse.serializer:serializer:2.0.0',
        msgpack      : 'org.msgpack:msgpack-core:0.9.10',
        vertx        : 'io.vertx:vertx-core:5.0.5',
        reactor      : 'io.projectreactor:reactor-core:3.8.0',
        rsocketCore  : 'io.rsocket:rsocket-core:1.1.5',
        rsocketNetty : 'io.rsocket:rsocket-transport-netty:1.1.5',
        rsocketLb    : 'io.rsocket:rsocket-load-balancer:1.1.5',
        netty        : 'io.netty:netty-all:4.2.7.Final',
        nashorn      : 'org.openjdk.nashorn:nashorn-core:15.7',
        poi          : 'org.apache.poi:poi-ooxml:5.3.0',
        poiFull      : 'org.apache.poi:poi-ooxml-full:5.3.0',
]

// -----------------------------------------------------------------------------------------------------
// Settings every project shares: toolchain, Groovy compiler heap, test platform and test dependencies.
// -----------------------------------------------------------------------------------------------------
allprojects { p ->
    apply plugin: 'groovy'
    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // Groovy 6.0.0 (2026-11-16): compileTestGroovy runs in a Gradle compiler worker, whose default 512m heap the
    // Groovy 6 compiler exhausts on a large test source set ("Java heap space" from ApiGroovyCompiler in WorkerDaemonServer).
    tasks.withType(GroovyCompile).configureEach {
        groovyOptions.forkOptions.memoryMaximumSize = '4g'
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }

    jar {
        exclude 'logback-test.xml'
    }

    dependencies {
        implementation "org.apache.groovy:groovy:$groovyVersion"
        implementation "org.apache.groovy:groovy-json:$groovyVersion"
        implementation rootProject.libs.slf4j
        implementation rootProject.libs.logback

        testImplementation platform('org.junit:junit-bom:5.10.0')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation "org.apache.groovy:groovy-test:$groovyVersion"
        testImplementation 'org.spockframework:spock-core:2.5-groovy-6.0'
        testImplementation 'org.awaitility:awaitility:4.3.0'
    }

    test {
        useJUnitPlatform()
        // ShellTask holds Windows processes in a Job Object through the JDK foreign-function API (1.4.2).
        jvmArgs '--enable-native-access=ALL-UNNAMED'
        // A --tests filter names classes in one module; the other modules have no match and must not fail the run.
        filter { failOnNoMatchingTests = false }
        testLogging {
            events "passed", "skipped", "failed"
            exceptionFormat "short"
        }
    }
}

// -----------------------------------------------------------------------------------------------------
// The root project: the aggregate GroovyConcurrentUtils artifact and the cross-module tests.
// -----------------------------------------------------------------------------------------------------
def gcuModules = [':gcu-core', ':gcu-cluster', ':gcu-taskgraph', ':gcu-actors', ':gcu-reactive']

dependencies {
    gcuModules.each { api project(it) }

    // The fixtures moved to gcu-taskgraph; the aggregate's fixtures variant passes them through, so
    // testFixtures('org.softwood:GroovyConcurrentUtils:2.0.0') still gives TaskGraphSpec.
    testFixturesApi testFixtures(project(':gcu-taskgraph'))

    // The root tests exercise several modules at once (the Hardening*Spec suites and the clustering tests),
    // so they see every library the modules use.
    testImplementation libs.hazelcast
    testImplementation libs.vertx
    testImplementation libs.reactor
    testImplementation libs.rsocketCore
    testImplementation libs.rsocketNetty
    testImplementation libs.netty
    testImplementation libs.esStorage
    testImplementation libs.esSerializer
    testImplementation libs.msgpack
    testImplementation libs.nashorn
    testImplementation libs.poi
    testImplementation "org.apache.groovy:groovy-sql:$groovyVersion"
    testImplementation "org.apache.groovy:groovy-templates:$groovyVersion"
    testImplementation 'com.h2database:h2:2.2.224'
    testImplementation 'org.wiremock:wiremock:3.3.1'
    testImplementation 'io.vertx:vertx-junit5:5.0.5'
    testImplementation 'io.projectreactor:reactor-test:3.8.0'
    testImplementation testFixtures(project(':gcu-taskgraph'))
}

// allJar: every GCU class in one jar. The consumer supplies the third-party libraries.
def allJar = tasks.register('allJar', Jar) {
    group = 'build'
    description = 'Every GCU module in one jar, without third-party classes -> build/libs/*-all.jar'
    archiveClassifier.set('all')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    gcuModules.each { m ->
        def sub = project(m)
        dependsOn "${m}:classes"
        from sub.sourceSets.main.output
    }
    exclude 'logback-test.xml'
}

// fatJar: GCU and every runtime dependency, service files merged, for running stand-alone.
// The shadow plugin is on the build classpath but not applied: applied, it adds a shadowJar variant (classifier
// 'all') to the published java component, which would publish a fat jar and collide with allJar.
def fatJar = tasks.register('fatJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    group = 'build'
    description = 'GCU and every runtime dependency in one jar -> build/libs/*-fat.jar'
    archiveClassifier.set('fat')
    configurations = [project.configurations.runtimeClasspath]
    from sourceSets.main.output
    mergeServiceFiles()
    exclude 'logback-test.xml', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST',
            'module-info.class', 'META-INF/versions/*/module-info.class'
}

// --- asciidoctor / PDF generation ----------------------------------------
// Two books from one set of chapters (docs/asciidoc/chapters/*.adoc):
//   index.adoc      the whole library          -> groovy-concurrent-utils-reference.pdf
//   taskgraph.adoc  the TaskGraph chapters only -> groovy-concurrent-utils-taskgraph.pdf
// HTML:    gradlew asciidoctor     -> build/docs/asciidoc/index.html, taskgraph.html
// PDF:     gradlew asciidoctorPdf  -> build/docs/asciidocPdf/
// -------------------------------------------------------------------------
asciidoctorj {
    // Plugin 4.0.5 (the latest release) still defaults to AsciidoctorJ 2.5.7 = Asciidoctor 2.0.18 on JRuby 9.3.8.0 (2022).
    // 3.0.1 is the current AsciidoctorJ and brings JRuby 9.4.14.
    version = '3.0.1'
    modules {
        pdf { version '2.3.19' }
        // asciidoctor-diagram renders the [plantuml] and [ditaa] blocks to images at build time (PlantUML
        // and ditaa are bundled). Without it the PDF and HTML printed the diagram source as text.
        diagram.use()
        diagram { version '2.3.1' }
    }
    // No Graphviz needed: docs/asciidoc/plantuml.cfg selects PlantUML's built-in Smetana layout.
    attributes 'plantuml-config': layout.projectDirectory.file('docs/asciidoc/plantuml.cfg').asFile.absolutePath,
               'plantumlconfig': layout.projectDirectory.file('docs/asciidoc/plantuml.cfg').asFile.absolutePath
}

// JRuby reaches into sun.misc.Unsafe, JNI (jffi) and JDK IO internals. On JDK 24+ each prints a warning
// block per run; these flags grant the access explicitly, for the asciidoctor worker JVMs only.
def asciidoctorJvmArgs = [
        '--enable-native-access=ALL-UNNAMED',
        '--sun-misc-unsafe-memory-access=allow',
        '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens', 'java.base/java.io=ALL-UNNAMED'
]

tasks.named('asciidoctor', AsciidoctorTask).configure { t ->
    t.sourceDir = layout.projectDirectory.dir('docs/asciidoc').asFile
    // Chapters are included by the two books, never converted on their own.
    t.sources { include('index.adoc', 'taskgraph.adoc') }
    t.outputDir = layout.buildDirectory.dir('docs/asciidoc').get().asFile
    t.baseDirFollowsSourceDir()
    t.jvm { jvmArgs(asciidoctorJvmArgs) }
}

tasks.named('asciidoctorPdf', AsciidoctorPdfTask).configure { t ->
    t.sourceDir = layout.projectDirectory.dir('docs/asciidoc').asFile
    t.sources { include('index.adoc', 'taskgraph.adoc') }
    t.outputDir = layout.buildDirectory.dir('docs/asciidocPdf').get().asFile
    t.baseDirFollowsSourceDir()
    // docs/asciidoc/theme/gcu-theme.yml: the default theme with the body text at 10pt for printing.
    t.attributes 'revdate': new Date().format('yyyy-MM-dd'),
                 'pdf-themesdir': layout.projectDirectory.dir('docs/asciidoc/theme').asFile.absolutePath,
                 'pdf-theme': 'gcu'
    t.jvm { jvmArgs(asciidoctorJvmArgs) }

    // index.pdf says nothing about which project it documents once it leaves the build directory.
    t.doLast {
        def outDir = layout.buildDirectory.dir('docs/asciidocPdf').get().asFile
        ['index.pdf'    : 'groovy-concurrent-utils-reference.pdf',
         'taskgraph.pdf': 'groovy-concurrent-utils-taskgraph.pdf'].each { from, to ->
            def src = new File(outDir, from)
            def dst = new File(outDir, to)
            if (src.exists()) {
                dst.delete()
                src.renameTo(dst)
                logger.lifecycle("DOCS: PDF written -> ${dst.absolutePath}")
            } else {
                logger.warn("DOCS: expected ${src} was not produced -- PDF NOT renamed")
            }
        }
    }
}

// -----------------------------------------------------------------------------------------------------
// Publishing: one publication per project, same POM details; artifactId = project name.
// -----------------------------------------------------------------------------------------------------
def pomDescriptions = [
        'GroovyConcurrentUtils': 'Groovy concurrency library: pools, promises, dataflow, actors, agents and the TaskGraph engine (aggregate of the gcu-* modules)',
        'gcu-core'             : 'GroovyConcurrentUtils core: promises, dataflow, worker pools, gstream, configuration, agents and security helpers',
        'gcu-cluster'          : 'GroovyConcurrentUtils cluster: Hazelcast manager and shared cluster state for TaskGraph and actors',
        'gcu-taskgraph'        : 'GroovyConcurrentUtils TaskGraph: the DAG workflow engine, task types, restricted scripts and persistence',
        'gcu-actors'           : 'GroovyConcurrentUtils actors: actor systems, supervision and remote actor transports',
        'gcu-reactive'         : 'GroovyConcurrentUtils reactive: Project Reactor helpers',
]

def sonatypeUsername = (findProperty('sonatypeUsername') ?: System.getenv('SONATYPE_USERNAME'))?.toString()
def sonatypePassword = (findProperty('sonatypePassword') ?: System.getenv('SONATYPE_PASSWORD'))?.toString()
def signingKey       = (findProperty('signingKey')       ?: System.getenv('SIGNING_KEY'))?.toString()
def signingPassword  = (findProperty('signingPassword')  ?: System.getenv('SIGNING_PASSWORD'))?.toString()

def isMavenLocalInvocation = gradle.startParameter.taskNames.any { it.toLowerCase().contains('mavenlocal') }
def isCentralInvocation = !isMavenLocalInvocation && gradle.startParameter.taskNames.any { t ->
    def n = t.toLowerCase()
    n.contains('sonatype') || n.contains('mavencentral') || n.contains('staging') ||
            n == 'publish' || n.endsWith(':publish')
}

def requireCentralSecrets = { String action ->
    def missing = []
    if (!sonatypeUsername || !sonatypePassword) missing << "Sonatype credentials (sonatypeUsername/sonatypePassword or env)"
    if (!signingKey || !signingPassword) missing << "Signing key (signingKey/signingPassword or env)"
    if (!missing.isEmpty()) {
        throw new GradleException("Cannot run '${action}' without: ${missing.join('; ')}")
    }
}

def validateCentralSecrets = tasks.register('validateCentralSecrets') {
    group = 'publishing'
    description = 'Validates Sonatype + signing secrets for Maven Central publishing.'
    onlyIf { isCentralInvocation }
    doLast { requireCentralSecrets(path) }
}

allprojects { p ->
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                // The test-fixtures variants carry a Gradle capability that a Maven POM cannot express.
                // Gradle consumers read the .module file, which is complete, so the POM warning is noise.
                if (p.plugins.hasPlugin('java-test-fixtures')) {
                    suppressPomMetadataWarningsFor('testFixturesApiElements')
                    suppressPomMetadataWarningsFor('testFixturesRuntimeElements')
                }

                pom {
                    name.set(p.name)
                    description.set(pomDescriptions[p.name] ?: p.name)
                    url.set(providers.gradleProperty('pomUrl').orElse('https://github.com/woodmawa/GroovyConcurrentUtils'))

                    licenses {
                        license {
                            name.set('The Apache License, Version 2.0')
                            url.set('https://www.apache.org/licenses/LICENSE-2.0.txt')
                        }
                    }

                    developers {
                        developer {
                            id.set(providers.gradleProperty('pomDeveloperId').orElse('woodmawa'))
                            name.set(providers.gradleProperty('pomDeveloperName').orElse('woodmawa'))
                            email.set(providers.gradleProperty('pomDeveloperEmail').orElse(''))
                        }
                    }

                    scm {
                        connection.set(providers.gradleProperty('pomScmConnection')
                                .orElse('scm:git:https://github.com/woodmawa/GroovyConcurrentUtils.git'))
                        developerConnection.set(providers.gradleProperty('pomScmDeveloperConnection')
                                .orElse('scm:git:ssh://git@github.com:woodmawa/GroovyConcurrentUtils.git'))
                        url.set(providers.gradleProperty('pomScmUrl')
                                .orElse('https://github.com/woodmawa/GroovyConcurrentUtils'))
                    }
                }
            }
        }
    }

    signing {
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.mavenJava
    }

    tasks.withType(Sign).configureEach { t ->
        onlyIf { isCentralInvocation }
        dependsOn(validateCentralSecrets)
    }

    tasks.withType(PublishToMavenRepository).configureEach { t ->
        if (t.repository?.name == 'sonatype') {
            t.doFirst { requireCentralSecrets(t.path) }
        }
    }
}

/**
 * Nexus publish plugin (publishes every project's mavenJava publication)
 */
nexusPublishing {
    repositories {
        sonatype {
            username = providers.gradleProperty('sonatypeUsername').orNull ?: sonatypeUsername
            password = providers.gradleProperty('sonatypePassword').orNull ?: sonatypePassword
        }
    }
}

/**
 * Convenience alias:
 *   ./gradlew publishToMavenCentral
 */
tasks.register('publishToMavenCentral') {
    group = 'publishing'
    description = 'Publishes every module and the aggregate to Sonatype/Maven Central (releases are staged then closed+released).'

    dependsOn allprojects.collect { "${it.path == ':' ? '' : it.path}:publish".toString() }

    if (!version.toString().endsWith('-SNAPSHOT')) {
        finalizedBy tasks.named('closeAndReleaseSonatypeStagingRepository')
    }
}
