// gcu-taskgraph: the TaskGraph engine and DSL, every task type (including ShellTask and its Windows Job Object),
    // the restricted script profile, EclipseStore persistence, resilience and saga support; plus the test fixtures
    // (TaskGraphSpec, TaskGraphVerifier) as testFixtures('org.softwood:gcu-taskgraph').
    apply plugin: 'java-test-fixtures'
    description = 'GroovyConcurrentUtils TaskGraph'

    dependencies {
        api project(':gcu-core')
        api project(':gcu-cluster')

        implementation "org.apache.groovy:groovy-sql:$groovyVersion"
        implementation "org.apache.groovy:groovy-templates:$groovyVersion"
        implementation libs.mail
        implementation libs.esStorage
        implementation libs.esConfig
        implementation libs.esSerializer
        implementation libs.msgpack
        implementation libs.nashorn

        // 3.0.0: no Apache POI here at all, not even compileOnly. XlsxTask/DocxTask/PptxTask, their DSLs and the Plan
        // model are POI-free; the POI-backed adapters moved to gcu-office, which TaskFactory reaches through the
        // OfficeBackend SPI (org.softwood.dag.task.spi). A POI import added here fails the compile -- that is the guard.

        testImplementation 'org.wiremock:wiremock:3.3.1'
        testImplementation 'com.h2database:h2:2.2.224'
        testImplementation 'io.vertx:vertx-junit5:5.0.5'

        // test-fixtures jar: TaskGraphSpec base class + verifier for library consumers
        testFixturesImplementation platform('org.junit:junit-bom:5.10.0')
        testFixturesImplementation 'org.junit.jupiter:junit-jupiter'
        testFixturesImplementation "org.apache.groovy:groovy:$groovyVersion"
        // Pinned to the same versions as the main dependencies: a dynamic version (2.0.+) cannot be
        // expressed in a Maven POM and produced a publication warning.
        testFixturesImplementation libs.slf4j
        testFixturesImplementation libs.logback
    }
