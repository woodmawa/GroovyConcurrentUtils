<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="Helvetica, Arial, sans-serif">
  <title>The software layers of GroovyConcurrentUtils</title>
  <desc>Applications sit on TaskGraph; TaskGraph sits on actors, agents, Gstream and reactive channels, then promises, dataflow and pools. Configuration, security services and clustering stand alongside every layer.</desc>

  <!-- consumers -->
  <rect x="20" y="14" width="760" height="44" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="400" y="33" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">Applications and services built on the library</text>
  <text x="400" y="49" text-anchor="middle" font-size="11" fill="#4b5563">for example the MCP agentic-workflow server</text>

  <!-- TaskGraph -->
  <rect x="20" y="72" width="600" height="190" rx="6" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.4"/>
  <text x="32" y="94" font-size="15" font-weight="bold" fill="#1e3a8a">TaskGraph</text>
  <text x="116" y="94" font-size="11" fill="#1e3a8a">org.softwood.dag</text>
  <text x="608" y="94" text-anchor="end" font-size="11" fill="#1e3a8a">a DSL and engine for graphs of tasks</text>

  <g font-size="10" fill="#1f2937" text-anchor="middle">
    <rect x="32" y="104" width="138" height="92" rx="4" fill="#ffffff" stroke="#1e3a8a" stroke-width="1"/>
    <text x="101" y="122" font-size="12" font-weight="bold">DSL and engine</text>
    <text x="101" y="142">graph, dependencies</text>
    <text x="101" y="158">gateways, sub-graphs</text>
    <text x="101" y="174">validation, timeouts</text>

    <rect x="178" y="104" width="138" height="92" rx="4" fill="#ffffff" stroke="#1e3a8a" stroke-width="1"/>
    <text x="247" y="122" font-size="12" font-weight="bold">Tasks</text>
    <text x="247" y="142">service, script, policy</text>
    <text x="247" y="158">HTTP, file, SQL, mail</text>
    <text x="247" y="174">LLM, manual, messaging</text>

    <rect x="324" y="104" width="138" height="92" rx="4" fill="#ffffff" stroke="#1e3a8a" stroke-width="1"/>
    <text x="393" y="122" font-size="12" font-weight="bold">Resilience</text>
    <text x="393" y="142">retry, circuit breaker</text>
    <text x="393" y="158">rate, resource limits</text>
    <text x="393" y="174">dead letters, sagas</text>

    <rect x="470" y="104" width="138" height="92" rx="4" fill="#ffffff" stroke="#1e3a8a" stroke-width="1"/>
    <text x="539" y="122" font-size="12" font-weight="bold">Run records</text>
    <text x="539" y="142">events and listeners</text>
    <text x="539" y="158">persistence, redaction</text>
    <text x="539" y="174">test harness</text>

    <rect x="32" y="204" width="576" height="46" rx="4" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="320" y="222" font-size="12" font-weight="bold">Security controls</text>
    <text x="320" y="240">restricted rules and scripts  |  HTTP and file guards  |  trusted true to opt out</text>
  </g>

  <!-- concurrency models -->
  <g text-anchor="middle" fill="#1f2937">
    <rect x="20" y="276" width="141" height="70" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
    <text x="90" y="296" font-size="13" font-weight="bold">Actors</text>
    <text x="90" y="312" font-size="10" fill="#166534">org.softwood.actor</text>
    <text x="90" y="332" font-size="10">mailbox, supervision, remote</text>

    <rect x="173" y="276" width="141" height="70" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="1.2"/>
    <text x="243" y="296" font-size="13" font-weight="bold">Agents</text>
    <text x="243" y="312" font-size="10" fill="#166534">org.softwood.agent</text>
    <text x="243" y="332" font-size="10">one object, updated in turn</text>

    <rect x="326" y="276" width="141" height="70" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="396" y="296" font-size="13" font-weight="bold">Gstream</text>
    <text x="396" y="312" font-size="10" fill="#166534">org.softwood.gstream</text>
    <text x="396" y="332" font-size="10">streams driven by closures</text>

    <rect x="479" y="276" width="141" height="70" rx="6" fill="#f0fdf4" stroke="#166534" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="549" y="296" font-size="13" font-weight="bold">Reactive channels</text>
    <text x="549" y="312" font-size="10" fill="#166534">org.softwood.reactive</text>
    <text x="549" y="332" font-size="10">queue and topic as a Flux</text>
  </g>

  <!-- core stack -->
  <g fill="#1f2937">
    <rect x="20" y="360" width="600" height="50" rx="6" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
    <text x="32" y="381" font-size="13" font-weight="bold">Promises</text>
    <text x="100" y="381" font-size="10" fill="#854d0e">org.softwood.promise</text>
    <text x="32" y="399" font-size="10.5">a value that arrives later: compose, time out, combine</text>

    <rect x="20" y="422" width="600" height="50" rx="6" fill="#fef9c3" stroke="#854d0e" stroke-width="1.2"/>
    <text x="32" y="443" font-size="13" font-weight="bold">Dataflow</text>
    <text x="100" y="443" font-size="10" fill="#854d0e">org.softwood.dataflow</text>
    <text x="32" y="461" font-size="10.5">single-assignment variables: readers wait for the writer</text>

    <rect x="20" y="484" width="600" height="50" rx="6" fill="#fde68a" stroke="#854d0e" stroke-width="1.2"/>
    <text x="32" y="505" font-size="13" font-weight="bold">Pools</text>
    <text x="100" y="505" font-size="10" fill="#854d0e">org.softwood.pool</text>
    <text x="32" y="523" font-size="10.5">one contract for running and scheduling work, on virtual threads by default</text>
  </g>

  <!-- shared services -->
  <rect x="636" y="72" width="144" height="462" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.2"/>
  <text x="708" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Shared services</text>
  <text x="708" y="107" text-anchor="middle" font-size="10" fill="#4b5563">open to every layer</text>
  <g text-anchor="middle" fill="#1f2937">
    <rect x="648" y="120" width="120" height="124" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1"/>
    <text x="708" y="146" font-size="12" font-weight="bold">Configuration</text>
    <text x="708" y="162" font-size="10" fill="#4b5563">org.softwood.config</text>
    <text x="708" y="190" font-size="10">layered settings,</text>
    <text x="708" y="206" font-size="10">each value traced</text>
    <text x="708" y="222" font-size="10">to its source</text>

    <rect x="648" y="256" width="120" height="124" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1"/>
    <text x="708" y="282" font-size="12" font-weight="bold">Security services</text>
    <text x="708" y="298" font-size="10" fill="#4b5563">org.softwood.security</text>
    <text x="708" y="326" font-size="10">secrets, TLS,</text>
    <text x="708" y="342" font-size="10">signed tokens,</text>
    <text x="708" y="358" font-size="10">login rate limits</text>

    <rect x="648" y="392" width="120" height="130" rx="4" fill="#ffffff" stroke="#374151" stroke-width="1" stroke-dasharray="5 3"/>
    <text x="708" y="418" font-size="12" font-weight="bold">Clustering</text>
    <text x="708" y="434" font-size="10" fill="#4b5563">org.softwood.cluster</text>
    <text x="708" y="462" font-size="10">optional: shared</text>
    <text x="708" y="478" font-size="10">state across JVMs</text>
    <text x="708" y="494" font-size="10">through Hazelcast</text>
  </g>

  <!-- platform -->
  <rect x="20" y="546" width="760" height="40" rx="6" fill="#e5e7eb" stroke="#374151" stroke-width="1.2"/>
  <text x="32" y="571" font-size="13" font-weight="bold" fill="#1f2937">The JVM</text>
  <text x="100" y="571" font-size="10.5" fill="#1f2937">Groovy 6  |  Java 25 toolchain  |  virtual threads where the JVM has them</text>
</svg>
