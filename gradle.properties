# Configuration cache disabled due to asciidoctor plugin incompatibility
# See: https://github.com/asciidoctor/asciidoctor-gradle-plugin/issues/644
org.gradle.configuration-cache=false

# Daemon heap. The default (512m) is not enough to build both PDF books in one run:
# the daemon stopped with "JVM garbage collector is thrashing" (2026-11-20).
org.gradle.jvmargs=-Xmx2g

groovyVersion = 6.0.0
